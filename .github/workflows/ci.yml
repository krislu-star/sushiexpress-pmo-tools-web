name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:types
      - run: pnpm test:coverage
      # CI 不使用真實資料或任何 Secret：以測試快照與非機密的測試密碼建置
      - run: pnpm build
        env:
          PMO_SNAPSHOT: tests/fixtures/snapshot.sample.json
          PMO_ACCESS_PASSWORD: ci-password
      - run: pnpm check:inline
      - run: pnpm exec tsx scripts/check-plaintext.ts out tests/fixtures/snapshot.sample.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - run: pnpm check:plaintext:e2e
      - run: pnpm e2e
      - run: pnpm build:e2e:readonly
      - run: pnpm e2e:readonly
      - run: pnpm build:perf
      - run: pnpm e2e:perf
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
